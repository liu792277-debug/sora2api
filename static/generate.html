<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sora2 生成入口</title>
  <style>
    body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#f8fafc;color:#0f172a;display:flex;align-items:center;justify-content:center;min-height:100vh}
    .card{background:#fff;border:1px solid #e2e8f0;border-radius:16px;padding:32px;box-shadow:0 10px 30px rgba(15,23,42,0.08);max-width:480px;width:90%;text-align:center}
    .btn{display:inline-flex;align-items:center;justify-content:center;border-radius:10px;padding:10px 16px;margin:8px;background:#0f172a;color:#fff;text-decoration:none}
    .btn.secondary{background:#e2e8f0;color:#0f172a}
  </style>
</head>
<body>
  <div class="card">
    <h1>生成入口已拆分</h1>
    <p>请选择进入视频生成或角色卡管理页面。</p>
    <div>
      <a class="btn" href="/static/video_generate.html">视频生成</a>
      <a class="btn secondary" href="/static/character_cards.html">角色卡</a>
    </div>
  </div>
  <script>
    if (window.parent !== window) {
      window.parent.postMessage({ type: 'sora-generate-height', height: document.body.scrollHeight, frameId: window.GENERATE_FRAME_ID || 'videoGenerateFrame' }, '*');
    }
  </script>
</body>
</html>
